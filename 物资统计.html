<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物资统计</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#0f0f1a;color:#fff;font-family:sans-serif;min-height:100vh}
.title{font-size:24px;text-align:center;color:#00bfff;margin-bottom:5px}
.subtitle{text-align:center;color:#666;font-size:12px;margin-bottom:20px}
.setting{display:flex;gap:10px;justify-content:center;margin-bottom:15px;flex-wrap:wrap}
.setting input{width:100px;padding:10px;font-size:16px;border-radius:8px;border:1px solid #444;background:#1e1e3e;color:#fff;text-align:center}
.setting button{padding:10px 20px;font-size:16px;border-radius:8px;border:none;background:#00bfff;color:#fff}
.pwd-box{background:#1e1e3e;border-radius:12px;padding:15px;margin-bottom:15px}
.pwd-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pwd-row input{flex:1;padding:10px;font-size:16px;border-radius:8px;border:1px solid #444;background:#0f0f1a;color:#fff}
.pwd-row input.id-input{max-width:100px;text-align:center}
.query-btn{width:100%;padding:15px;font-size:18px;border-radius:12px;border:none;background:#00bfff;color:#fff;margin-bottom:20px}
.device{margin-bottom:30px;border-bottom:1px solid #333;padding-bottom:20px}
.device-title{font-size:18px;color:#00bfff;margin-bottom:10px;text-align:center}
.countdown{text-align:center;color:#ffcc00;font-size:14px;margin-bottom:10px}
.off{text-align:center;color:#666;font-size:14px;padding:20px}
.item{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#1e1e3e,#2a2a4e);border-radius:12px;padding:15px;margin-bottom:10px;border-left:4px solid #00bfff}
.item .left{display:flex;align-items:center;font-size:16px}
.item .icon{font-size:22px;margin-right:10px}
.item .count{font-size:22px;font-weight:bold;color:#00bfff}
.status{text-align:center;color:#555;font-size:12px;margin-top:15px}
</style>
</head>
<body>
<div class="title">📊 物资统计</div>
<div class="subtitle">星魔王牌战争脚本</div>

<div class="setting">
    <input type="number" id="设备数" value="1" min="1" max="10" placeholder="设备数量">
    <button onclick="生成口令框()">确定</button>
</div>

<div id="pwdArea"></div>
<div id="content"></div>
<div class="status" id="status"></div>

<script>
var GITHUB_USER = 'yeakuex';
var GITHUB_REPO = 'wuzi-data';

var 物资配置 = [
    {key: '木头',  icon: '🪵', color: '#8B4513'},
    {key: '石头',  icon: '🪨', color: '#9e9b84'},
    {key: '铁',    icon: '⛏️', color: '#787569'},
    {key: '硫磺',  icon: '💎', color: '#a9991d'},
    {key: '精铁',  icon: '🔩', color: '#44472d'},
    {key: '布',    icon: '🧵', color: '#baa374'},
    {key: '油',    icon: '🛢️', color: '#882a14'},
    {key: '原油',  icon: '⛽', color: '#b45d37'}
];

var 当前设备数 = 1;
var 设备数据缓存 = {};

function 生成口令框(){
    当前设备数 = parseInt(document.getElementById('设备数').value) || 1;
    if(当前设备数 < 1) 当前设备数 = 1;
    if(当前设备数 > 10) 当前设备数 = 10;
    localStorage.setItem('设备数', 当前设备数);
    
    var html = '<div class="pwd-box">';
    for(var i=0; i<当前设备数; i++){
        var 保存标识 = localStorage.getItem('标识_' + i) || '';
        var 保存口令 = localStorage.getItem('口令_' + i) || '';
        html += '<div class="pwd-row">';
        html += '<input type="text" class="id-input" id="标识_' + i + '" placeholder="标识" value="' + 保存标识 + '">';
        html += '<input type="text" id="口令_' + i + '" placeholder="输入口令" value="' + 保存口令 + '">';
        html += '</div>';
    }
    html += '</div>';
    html += '<button class="query-btn" onclick="查询()">🔍 查询</button>';
    document.getElementById('pwdArea').innerHTML = html;
    document.getElementById('content').innerHTML = '';
    document.getElementById('status').textContent = '';
}

function 查询(){
    var 完成数 = 0;
    var 结果数组 = new Array(当前设备数);
    
    for(var i=0; i<当前设备数; i++){
        (function(index){
            var 标识 = document.getElementById('标识_' + index).value.trim();
            var 口令 = document.getElementById('口令_' + index).value.trim();
            localStorage.setItem('标识_' + index, 标识);
            localStorage.setItem('口令_' + index, 口令);
            
            if(!标识 || !口令){
                结果数组[index] = '<div class="device"><div class="device-title">📱 未填写</div><div class="off">标识或口令为空</div></div>';
                完成数++;
                if(完成数 === 当前设备数) 显示结果(结果数组);
                return;
            }
            
            读设备(标识, 口令, function(data){
                设备数据缓存[index] = { 标识: 标识, 口令: 口令, data: data };
                结果数组[index] = 渲染设备(标识, data, 口令);
                完成数++;
                if(完成数 === 当前设备数){
                    显示结果(结果数组);
                    启动倒计时();
                }
            });
        })(i);
    }
}

function 显示结果(结果数组){
    document.getElementById('content').innerHTML = 结果数组.join('');
    document.getElementById('status').textContent = '更新于 ' + new Date().toLocaleString();
}

function 读设备(标识, 输入口令, callback){
    // 用 raw.githubusercontent.com，实时，不用清缓存
    var url = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/wuzi_' + 标识 + '.json?t=' + Date.now();
    fetch(url)
        .then(function(r){
            if(!r.ok) throw new Error('not found');
            return r.json();
        })
        .then(function(data){ callback(data); })
        .catch(function(){ callback(null); });
}

function 渲染设备(标识, data, 输入口令){
    var html = '<div class="device" id="device_' + 标识 + '">';
    html += '<div class="device-title">📱 ' + 标识 + '</div>';
    
    if(!data){
        html += '<div class="off">📭 没有数据</div>';
    } else if(String(data.口令) !== String(输入口令)){
        html += '<div class="off">🔒 口令不匹配</div>';
    } else if(!data.开启){
        html += '<div class="off">⏸ 未开启统计</div>';
    } else if(!data.心跳时间 || !data.有效期小时){
        html += '<div class="off">⚠️ 数据格式过旧，请更新自动精灵</div>';
    } else {
        html += 渲染内容(标识, data);
    }
    html += '</div>';
    return html;
}

function 渲染内容(标识, data){
    var 过期时刻 = data.心跳时间 + data.有效期小时 * 3600 * 1000;
    var 剩余毫秒 = 过期时刻 - Date.now();
    var html = '';
    
    if(剩余毫秒 <= 0){
        html += '<div class="off">⏰ 数据已过期<br>请启动自动精灵重新同步</div>';
        return html;
    }
    
    var 剩余秒 = Math.floor(剩余毫秒 / 1000);
    var 时 = Math.floor(剩余秒 / 3600);
    var 分 = Math.floor((剩余秒 % 3600) / 60);
    var 秒 = 剩余秒 % 60;
    html += '<div class="countdown">⏱ 剩余：' + 时 + '时' + 分 + '分' + 秒 + '秒</div>';
    
    for(var i=0; i<物资配置.length; i++){
        var cfg = 物资配置[i];
        var count = data[cfg.key] || 0;
        html += '<div class="item" style="border-left-color:' + cfg.color + '">';
        html += '<span class="left"><span class="icon">' + cfg.icon + '</span>';
        html += '<span style="color:' + cfg.color + '">' + cfg.key + '</span></span>';
        html += '<span class="count">' + count + '</span></div>';
    }
    return html;
}

function 启动倒计时(){
    if(window._timer) clearInterval(window._timer);
    window._timer = setInterval(function(){
        for(var key in 设备数据缓存){
            var 缓存 = 设备数据缓存[key];
            if(!缓存 || !缓存.data || !缓存.data.心跳时间) continue;
            var el = document.getElementById('device_' + 缓存.标识);
            if(!el) continue;
            var 剩余毫秒 = 缓存.data.心跳时间 + 缓存.data.有效期小时 * 3600 * 1000 - Date.now();
            var 旧 = el.querySelector('.countdown');
            if(剩余毫秒 <= 0){
                el.innerHTML = '<div class="device-title">📱 ' + 缓存.标识 + '</div><div class="off">⏰ 数据已过期<br>请启动自动精灵重新同步</div>';
            } else if(旧){
                var 剩余秒 = Math.floor(剩余毫秒 / 1000);
                var 时 = Math.floor(剩余秒 / 3600);
                var 分 = Math.floor((剩余秒 % 3600) / 60);
                var 秒 = 剩余秒 % 60;
                旧.textContent = '⏱ 剩余：' + 时 + '时' + 分 + '分' + 秒 + '秒';
            }
        }
    }, 1000);
}

// 启动
var 保存设备数 = localStorage.getItem('设备数') || 1;
document.getElementById('设备数').value = 保存设备数;
当前设备数 = parseInt(保存设备数);
生成口令框();
</script>
</body>
</html>
